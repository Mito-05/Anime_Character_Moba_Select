<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="/images/logo.png"> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <main class="container mb-5">
        <h1 class="d-flex justify-content-center">Personajes de Manga y Anime</h1>
        <div id="animeSection" class="cardDocumentaries"></div>

    <footer class="mainFooter p-4 mt-4">

            <p class="footerInfo mb-0">&copy; Copyright 2026</p>
            <div class="footerSocialMedia">
                <a href="#"><img src="images/github.png" alt="Github"></a>
                <a href="#"><img src="images/linkedin.png" alt="Linkedin"></a>
            </div>
        </div>
    </footer>

    <script src="main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
