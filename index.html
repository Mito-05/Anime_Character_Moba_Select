<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="https://res.cloudinary.com/divgcktiw/image/upload/v1779471461/Gemini_Generated_Image_q6uzrrq6uzrrq6uz-removebg-preview_nrh7w5.png"> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Enciclopedia de Personajes de Anime</title>
</head>
<body>

    <header class="mainHeader mb-5">
        <div class="sideIdentity text-center py-3">
            <img class="img-fluid" src="https://res.cloudinary.com/divgcktiw/image/upload/v1779474555/Gemini_Generated_Image_7xxhv17xxhv17xxh-removebg-preview_1_rnd8j7.png" alt="Logo">
        </div>
    </header>

<main class="container mb-5">
        <h1 class="text-center text-orange mb-4">Personajes de Manga y Anime</h1>
        
        <div id="filterContainer" class="text-center mb-5">
            <div class="d-flex justify-content-center flex-wrap gap-2 mb-3">
                <span class="text-muted w-100 mb-1 small d-block">FILTRAR POR SERIE</span>
                <button class="btn btn-outline-danger btn-sm active" onclick="filterBy('all', 'origin_work')">Todos</button>
                <button class="btn btn-outline-danger btn-sm" onclick="filterBy('One Piece', 'origin_work')">One Piece</button>
                <button class="btn btn-outline-danger btn-sm" onclick="filterBy('Naruto', 'origin_work')">Naruto</button>
                <button class="btn btn-outline-danger btn-sm" onclick="filterBy('Jujutsu Kaisen', 'origin_work')">Jujutsu Kaisen</button>
                <button class="btn btn-outline-danger btn-sm" onclick="filterBy('Bleach', 'origin_work')">Bleach</button>
                <button class="btn btn-outline-danger btn-sm" onclick="filterBy('Witch Hat Atelier (Tongari Boushi no Atelier)', 'origin_work')">Witch Hat Atelier</button>
            </div>

            <div class="d-flex justify-content-center flex-wrap gap-2">
                <span class="text-muted w-100 mb-1 small d-block">FILTRAR POR ROL EN LA HISTORIA</span>
                <button class="btn btn-outline-primary btn-sm" onclick="filterBy('Protagonista', 'role')">Protagonistas</button>
                <button class="btn btn-outline-primary btn-sm" onclick="filterBy('Antagonista', 'role')">Antagonistas / Villanos</button>
                <button class="btn btn-outline-primary btn-sm" onclick="filterBy('Mentor / Secundario Principal', 'role')">Mentores y Secundarios</button>
            </div>
        </div>

        <div id="animeSection" class="cardDocumentaries"></div>
    </main>

    <footer class="mainFooter p-4 mt-4">
        <div class="container d-flex justify-content-between align-items-center">
            <p class="footerInfo mb-0">&copy; Copyright 2026</p>
            <div class="footerSocialMedia">
                <a href="#"><img src="https://res.cloudinary.com/divgcktiw/image/upload/v1779471264/25231_ntuygi.png" alt="Github"></a>
                <a href="#"><img src="https://res.cloudinary.com/divgcktiw/image/upload/v1779471227/960px-LinkedIn_logo_initials_kzcayq.png" alt="Linkedin"></a>
            </div>
        </div>
    </footer>

    <script src="main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
